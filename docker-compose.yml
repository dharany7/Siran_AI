
services:
  postgres:
    image: postgres:16-alpine
    container_name: siren_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: siren
      POSTGRES_PASSWORD: siren
      POSTGRES_DB: siren_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siren -d siren_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
